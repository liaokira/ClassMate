openapi: '3.0.3'

info:
  description: ClassMate Backend
  version: 0.1.0
  title: ClassMate Backend

servers:
  - url: http://localhost:3010/v0

paths:

  /register:
    post:
      description: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/loginCredentials'
      responses:
        201:
          description: 'Successful registration'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: 'User already exists'

  /login:
    post:
      description: login
      requestBody:
        description: Request Body
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        200:
          description: Credentials correct
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          description: Invalid credentials
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'

  /group:
    post:
      security:
        - bearerAuth: []
      description: create a study group
      requestBody:
        description: specifics of the study group (name, time, etc.)
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                group_name:
                  type: string
                group_description:
                  type: string
                color:
                  type: string
                associated_class:
                  type: string
              required:
                - group_name
                - color
                - associated_class
      responses:
        201:
          description: study group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ID'
        400:
          description: Bad request. Invalid data provided
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'

  /group/{id}:
    get:
      security:
        - bearerAuth: []
      description: get information about a study group
      parameters:
        - name: id
          in : path
          required: true
          description: ID of the study group
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Study group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupFullData'
        404:
          description: No study group with ID found
    put:
      security:
        - bearerAuth: []
      description: update information of a study group
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the study group
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupData'
      responses:
        200:
          description: study group successfully updated
        404:
          description: No study group with ID found

  /group/{id}/join:
    post:
      security:
        - bearerAuth: []
      description: join a study group
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the study group
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                member_id:
                  type: string
                  format: uuid
              required:
                - member_id
      responses:
        200:
          description: user successfully joined study group
        400:
          description: user is already a member of study group
        404:
          description: no study group found

  /group/{id}/leave:
    delete:
      description: leave a study group
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the study group
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                member_id:
                  type: string
                  format: uuid
              required:
                - member_id
      responses:
        200:
          description: successfully left study group
        400:
          description: user is not a member of study group
        404:
          description: no study group found
  # /group/{id}/approve:
  #   put:
  #     description: approve or reject a join request


  /group/search:
    get:
      security:
        - bearerAuth: []
      description: search for message groups by name
      parameters:
        - name: searchFor
          in: query
          required: true
          description: name to search for
          schema:
            type: string
      responses:
        200:
          description: study groups found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupArray'
        404:
          description: no study groups found

  /profile/{id}:
    get:
      security:
        - bearerAuth: []
      summary: Get user profile by ID
      description: Retrieves user profile details based on the provided ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user profile to retrieve.
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Profile Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileData'
        404:
          description: Not Found
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
  # /profile:
    post:
      security:
        - bearerAuth: []
      description: setprofile
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user profile to set.
          schema:
            type: string
            format: uuid
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio:
                  type: string
                full_name:
                  type: string
      responses:
        200:
          description: Profile Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ID'
        201:
          description: Profile Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ID'
        404:
          description: Not Found
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'

  /messages/{id}:
    get:
      security:
        - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the group to retrieve messages from
        schema:
          type: string
          format: uuid
      responses:
        200:
          description: Messages Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageArray'
        404:
          description: Not Found
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'

components:
  schemas:
    UnexpectedError:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    Credentials:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password
    loginCredentials:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string
      required:
        - email
        - password
        - name
    User:
      type: object
      properties:
        name:
          type: string
        accessToken:
          type: string
      required:
        - name
        - accessToken
    ID:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id
    ProfileData:
      type: object
      properties:
        id:
          type: string
        bio:
          type: string
        full_name:
          type: string
      required:
        - id
        - bio
        - full_name
        
    GroupData:
      type: object
      properties:
        group_name:
          type: string
        group_description:
          type: string
        color:
          type: string
        associated_class:
          type: string
      # required:
      #   - group_name

    GroupFullData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        group_name:
          type: string
        color:
          type: string
        associated_class:
          type: string
        members:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
      required:
        - id
        - group_name
        - color
        - associated_class
        - members

    # an array of matched groups
    GroupArray:
      type: array
      items:
        $ref: '#/components/schemas/GroupData'

    MessageData:
      type: object
      properties:
        sender_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        message:
          type: string
      required:
        - sender_id
        - group_id
        - message
    
    MessageArray:
      type: array
      items:
        $ref: '#/components/schemas/MessageData'
      
  securitySchemes:
    bearerAuth:            # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT    # optional, arbitrary value for documentation purposes