openapi: "3.0.3"

info:
  description: ClassMate Backend
  version: 0.1.0
  title: ClassMate Backend

servers:
  - url: http://localhost:3010/v0

paths:
  /register:
    post:
      summary: register
      # No security -> public
      description: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/loginCredentials"
      responses:
        201:
          description: "Successful registration"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        400:
          description: "User already exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /login:
    post:
      summary: login
      # No security -> public
      description: login
      requestBody:
        description: Request Body
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        200:
          description: Credentials correct
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        401:
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnexpectedError"

  /group:
    get:
      summary: retrieves all groups
      security:
        - bearerAuth: []
      description: returns an array of all groups
      responses:
        200:
          description: successfully retrieved all groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupArray"
    post:
      summary: create a new study group
      security:
        - bearerAuth: []
      description: create a study group
      requestBody:
        description: specifics of the study group (name, time, etc.)
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                group_name:
                  type: string
                group_description:
                  type: string
                color:
                  type: string
                associated_class:
                  type: string
              required:
                - group_name
                - color
                - associated_class
      responses:
        201:
          description: study group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ID"
        400:
          description: Bad request. Invalid data provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnexpectedError"

  /group/discovery:
    get:
      summary: retrieves all groups the user is not a member of
      security:
        - bearerAuth: []
      description: returns an array of all groups the user is not a member of
      responses:
        200:
          description: successfully retrieved all groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupArray"

  /group/{id}:
    get:
      summary: get information about a study group given an ID
      security:
        - bearerAuth: []
      description: get information about a study group
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the study group
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Study group found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupFullData"
        404:
          description: No study group with ID found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: update the information of a study group given an ID
      security:
        - bearerAuth: []
      description: update information of a study group
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the study group
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupData"
      responses:
        200:
          description: study group successfully updated
        404:
          description: No study group with ID found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /group/{id}/join:
    post:
      summary: join a study group
      security:
        - bearerAuth: []
      description: join a study group
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the study group
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                member_id:
                  type: string
                  format: uuid
              required:
                - member_id
      responses:
        200:
          description: user successfully joined study group
        400:
          description: user is already a member of study group
        404:
          description: no study group found

  /group/{id}/leave:
    delete:
      summary: leave a study group
      security:
        - bearerAuth: []
      description: leave a study group
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the study group
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                member_id:
                  type: string
                  format: uuid
              required:
                - member_id
      responses:
        200:
          description: successfully left study group
        400:
          description: user is not a member of study group
        404:
          description: no study group found
  # /group/{id}/approve:
  #   put:
  #     description: approve or reject a join request


  /group/search:
    get:
      summary: search for study groups given a keyword or phrase
      security:
        - bearerAuth: []
      description: search for study groups by name
      parameters:
        - name: searchFor
          in: query
          required: true
          description: name to search for
          schema:
            type: string
      responses:
        200:
          description: study groups found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupArray"
        404:
          description: no study groups found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /group/{id}/image:
    get:
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique user ID
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Image retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSchema"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: "Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique user ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageSchema"
      responses:
        200:
          description: Image uploaded successfully
        404:
          description: "Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{id}:
    get:
      security:
        - bearerAuth: []
      summary: Get user profile by ID
      description: Retrieves user profile details based on the provided ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user profile to retrieve.
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Profile Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileData"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
  # /profile:
    put:
      summary: set the user profile of a user
      security:
        - bearerAuth: []
      description: setprofile
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user profile to set.
          schema:
            type: string
            format: uuid
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio:
                  type: string
                full_name:
                  type: string
      responses:
        200:
          description: Profile Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ID"
        201:
          description: Profile Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ID"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnexpectedError"
  
  /profile/{id}/groups:
    get:
      summary: get all the study groups a user is in
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: user UUID
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: an array of study groups the user is a member of
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupArray"
        404:
          description: user not found

  /profile/{id}/classes:
    summary: get all the classes a user is in
    get:
      security:
        - bearerAuth: []
      summary: Get all classes for a user
      parameters:
        - name: id
          in: path
          required: true
          description: The user's UUID
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: A list of classes the user is enrolled in.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      security:
        - bearerAuth: []
      summary: Add a class to a user's profile
      parameters:
        - name: id
          in: path
          required: true
          description: The user's UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                class_name:
                  type: string
                # start_time:
                #   type: integer
                #   minimum: 0
                #   maximum: 1440
                # end_time:
                #   type: integer
                #   minimum: 0
                #   maximum: 1440
              required:
                - class_name
                # - start_time
                # - end_time
      responses:
        201:
          description: Class added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{id}/classes/{classId}:
    delete:
      security:
        - bearerAuth: []
      summary: Remove a class from a user's profile
      parameters:
        - name: id
          in: path
          required: true
          description: The user's UUID
          schema:
            type: string
            format: uuid
        - name: classId
          in: path
          required: true
          description: The class UUID to remove
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Class removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: Class not found for user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/{id}/image:
    get:
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique user ID
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Image retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSchema"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: "Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique user ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageSchema"
      responses:
        200:
          description: Image uploaded successfully
        404:
          description: "Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"                

  /classes:
    get:
      security:
        - bearerAuth: []
      summary: Get all classes
      description: Returns a list of all classes stored in the database.
      responses:
        200:
          description: A list of all classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'

  /messages/{id}:
    get:
      summary: get messages from a study group
      security:
        - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the group to retrieve messages from
        schema:
          type: string
          format: uuid
      responses:
        200:
          description: Messages Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageArray'
        404:
          description: Not Found
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'

  /users/searchFriend:
    get:
      security:
        - bearerAuth: []
      summary: Check if given user/email combination is already friends
      description: Checks if the user with `userId` is already friends with the user who has `email`.
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        200:
          description: They are already friends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleUser"
        400:
          description: Missing userId or email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: Not friends or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        405:
          description: User is self
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/search:
    get:
      security:
        - bearerAuth: []
      summary: Search for a user by email
      description: Looks up a user in the member table by email
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        200:
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/SimpleUser"
        400:
          description: Missing email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/addFriend:
    put:
      security:
        - bearerAuth: []
      summary: Add a user to the friend list
      description: Inserts a single record in the friend table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFriendRequest"
      responses:
        201:
          description: Friend added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        400:
          description: Missing userId or friend id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: One or both users do not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        409:
          description: Already friends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/getFriends:
    get:
      security:
        - bearerAuth: []
      summary: Gets friends of the logged in user
      description: Retrieves list of friends from userId
      parameters:
        - name: userId
          in: query
          required: true
          description: The ID of the logged in user
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: List of friends sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  friends:
                    type: array
                    items:
                      $ref: "#/components/schemas/SimpleUser"
        400:
          description: Missing userId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    UnexpectedError:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string

    Credentials:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    loginCredentials:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string
      required:
        - email
        - password
        - name

    User:
      type: object
      properties:
        name:
          type: string
        accessToken:
          type: string
      required:
        - name
        - accessToken

    ID:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id

    ProfileData:
      type: object
      properties:
        id:
          type: string
        bio:
          type: string
        full_name:
          type: string
      required:
        - id
        - bio
        - full_name

    GroupData:
      type: object
      properties:
        group_name:
          type: string
        group_description:
          type: string
        color:
          type: string
        associated_class:
          type: string
      # required:
      #   - group_name

    GroupFullData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        group_name:
          type: string
        color:
          type: string
        associated_class:
          type: string
        members:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
      required:
        - id
        - group_name
        - color
        - associated_class
        - members

    GroupArray:
      type: array
      items:
        $ref: '#/components/schemas/GroupData'

    MessageData:
      type: object
      properties:
        sender_id:
          type: string
          format: uuid
        sender_name:
          type: string
        group_id:
          type: string
          format: uuid
        message:
          type: string
      required:
        - sender_id
        - group_id
        - message
    
    MessageArray:
      type: array
      items:
        $ref: '#/components/schemas/MessageData'

    Class:
      type: object
      properties:
        id:
          type: string
          format: uuid
        class_name:
          type: string
        start_time:
          type: integer
          minimum: 0
          maximum: 1440
        end_time:
          type: integer
          minimum: 0
          maximum: 1440
      required:
        - id
        - class_name
        - start_time
        - end_time

    SimpleUser:
      description: Basic user info
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string

    AddFriendRequest:
      description: Body to add a friend
      type: object
      properties:
        userId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
      required:
        - userId
        - id
    ImageSchema:
      type: object
      properties:
        image:
          type: string
          format: binary
          description: The image file to upload
      required:
        - image
