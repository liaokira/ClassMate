openapi: '3.0.3'

info:
  description: ClassMate Backend
  version: 0.1.0
  title: ClassMate Backend

servers:
  - url: http://localhost:3010/v0

paths:
  /register:
    post:
      description: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/loginCredentials'
      responses:
        201:
          description: 'Successful registration'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: 'User already exists'
  /login:
    post:
      description: login
      requestBody:
        description: Request Body
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        200:
          description: Credentials correct
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          description: Invalid credentials
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
  /group:
    post:
      description: create a study group
      requestBody:
        description: specifics of the study group (name, time, etc.)
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupData'
      responses:
        201:
          description: study group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ID'
        400:
          description: Bad request. Invalid data provided
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
  /group/{id}:
    get:
      description: get information about a study group
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the study group
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Study group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupFullData'
        404:
          description: No study group with ID found
    put:
      description: update information of a study group
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the study group
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupData'
      responses:
        200:
          description: study group successfully updated
        404:
          description: No study group with ID found
  /group/search:
    get:
      description: search for message groups by name
      parameters:
        - name: searchFor
          in: query
          required: true
          description: name to search for
          schema:
            type: string
      responses:
        200:
          description: study groups found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupArray'
        404:
          description: no study groups found
  /profile/{id}:
    get:
      summary: Get user profile by ID
      description: Retrieves user profile details based on the provided ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user profile to retrieve.
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Profile Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileData'
        404:
          description: Not Found
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
    put:
      description: setprofile
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user profile to retrieve.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileData'
      responses:
        200:
          description: Profile Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ID'
        201:
          description: Profile Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ID'
        404:
          description: Not Found
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'
  /profile/{id}/classes:
    get:
      summary: Get all classes for a user
      parameters:
        - name: id
          in: path
          required: true
          description: The user's UUID
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: A list of classes the user is enrolled in.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Class'
    post:
      summary: Add a class to a user's profile
      parameters:
        - name: id
          in: path
          required: true
          description: The user's UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                class_name:
                  type: string
              required:
                - class_name
      responses:
        201:
          description: Class added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Class'
        400:
          description: Bad Request
  /profile/{id}/classes/{classId}:
    delete:
      summary: Remove a class from a user's profile
      parameters:
        - name: id
          in: path
          required: true
          description: The user's UUID
          schema:
            type: string
            format: uuid
        - name: classId
          in: path
          required: true
          description: The class UUID to remove
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Class removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: Class not found for user
  /classes:
    get:
      summary: Get all classes
      description: Returns a list of all classes stored in the database.
      responses:
        200:
          description: A list of all classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Class'
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnexpectedError'

components:
  schemas:
    UnexpectedError:
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    Credentials:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password
    loginCredentials:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string
      required:
        - email
        - password
        - name
    User:
      type: object
      properties:
        name:
          type: string
        accessToken:
          type: string
      required:
        - name
        - accessToken
    ID:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id
    ProfileData:
      type: object
      properties:
        id:
          type: string
        bio:
          type: string
        full_name:
          type: string
      required:
        - id
        - bio
        - full_name
    GroupData:
      type: object
      properties:
        group_name:
          type: string
      required:
        - group_name
    GroupFullData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        group_name:
          type: string
      required:
        - id
        - group_name
    GroupArray:
      type: array
      items:
        $ref: '#/components/schemas/GroupData'
    Class:
      type: object
      properties:
        id:
          type: string
          format: uuid
        class_name:
          type: string
      required:
        - id
        - class_name
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
